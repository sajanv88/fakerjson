# Example only: do not commit real credentials. Create it with:
#   kubectl -n fakerjson create secret generic fakerjson-redis \
#     --from-literal=REDIS_URL='rediss://:<access-key>@<name>.redis.cache.windows.net:6380'
# or sync it from Azure Key Vault with the Secrets Store CSI driver.
apiVersion: v1
kind: Secret
metadata:
  name: fakerjson-redis
  namespace: fakerjson
type: Opaque
stringData:
  REDIS_URL: rediss://:CHANGE_ME@my-cache.redis.cache.windows.net:6380
