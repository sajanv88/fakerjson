# Local stack: the API behind Redis, like production.
#   docker compose up --build
# Then open http://localhost:3000/docs
services:
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: fakerjson:local
    environment:
      PORT: 3000
      LOG_LEVEL: info
      REDIS_URL: redis://redis:6379
      # Docker's bridge network is a private range, already trusted by default.
      TRUST_PROXY: loopback,linklocal,uniquelocal
    ports:
      - '3000:3000'
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
